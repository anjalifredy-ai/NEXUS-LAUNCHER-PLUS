name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build NEXUS LAUNCHER PLUS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app_pojavlauncher/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-LAUNCHER-PLUS-APK
          path: app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-LAUNCHER-PLUS-mapping
          path: app_pojavlauncher/build/outputs/mapping/**/*
          if-no-files-found: ignore
          retention-days: 14
